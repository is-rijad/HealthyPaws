services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    restart: unless-stopped
    container_name: database
    env_file:
      - ./HealthyPaws.WebApi/.env
    ports:
      - "1434:1433"
    expose:
      - 1433
    volumes:
      - database_data:/var/lib/database
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q 'SELECT 1' -No" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - healthy-paws
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ./HealthyPaws.WebApi/.env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - healthy-paws

volumes:
  database_data:
  rabbitmq_data:

networks:
  healthy-paws:
    driver: bridge
